name: 'Clasp Action'
description: 'Push, pull, or deploy to Google Apps Script using clasp'
branding:
  icon: 'arrow-up-circle'
  color: 'blue'
inputs:
  refreshToken:
    description: 'refresh_token written in .clasprc.json'
    required: true
  clientId:
    description: 'clientId written in .clasprc.json'
    required: true
  clientSecret:
    description: 'clientSecret written in .clasprc.json'
    required: true
  scriptId:
    description: 'scriptId written in .clasp.json'
    required: true
  rootDir:
    description: 'Directory where scripts are stored'
    required: false
  command:
    description: 'Command to execute (push, pull, or deploy)'
    required: true
  description:
    description: 'Description of the deployment'
    required: false
  deployId:
    description: 'Deploy ID that will be updated'
    required: false
runs:
  using: 'docker'
  image: 'Dockerfile'
